name: Monthly EoM Run

on:
  # Manual trigger button
  workflow_dispatch:
    inputs:
      load_data:
        description: "Re-download data (yfinance) before training?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      train_model:
        description: "Train the model?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      run_simulation:
        description: "Run backtest?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

  # Schedule (UTC). Run daily on 28..31, then we detect the last day in a step.
  schedule:
    - cron: "0 20 28-31 * *"   # 20:00 UTC on 28-31 (≈ 22:00 or 21:00 Berlin depending on DST)

permissions:
  contents: write   # allow committing results back to the repo

concurrency:
  group: monthly-eom
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # --- Only proceed on the last day of the month when triggered by 'schedule'
      - name: Exit if NOT the last day (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          # If tomorrow is day 01, then today is the last day (UTC)
          if [ "$(date -u -d tomorrow +%d)" != "01" ]; then
            echo "Not the last day of the month (UTC). Exiting."
            exit 0
          fi
          echo "It IS the last day of the month (UTC). Continuing..."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # You can control flags here for schedule runs.
      # For manual runs, read from inputs.
      - name: Set flags for schedule or manual
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "LOAD_DATA=${{ inputs.load_data }}" >> $GITHUB_OUTPUT
            echo "TRAIN_MODEL=${{ inputs.train_model }}" >> $GITHUB_OUTPUT
            echo "RUN_SIMULATION=${{ inputs.run_simulation }}" >> $GITHUB_OUTPUT
          else
            # Scheduled defaults for end-of-month:
            echo "LOAD_DATA=true" >> $GITHUB_OUTPUT
            echo "TRAIN_MODEL=true" >> $GITHUB_OUTPUT
            echo "RUN_SIMULATION=true" >> $GITHUB_OUTPUT
          fi

      - name: Run monthly pipeline
        env:
          LOAD_DATA: "${{ steps.flags.outputs.LOAD_DATA }}"
          TRAIN_MODEL: "${{ steps.flags.outputs.TRAIN_MODEL }}"
          RUN_SIMULATION: "${{ steps.flags.outputs.RUN_SIMULATION }}"
        run: |
          python automation.py

      # Save outputs as workflow artifacts (downloadable from the run page)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ github.run_id }}
          path: |
            data/quarterly_data.csv
            data/backtest_history.csv
            data/backtest_trades.csv
            data/backtest_metrics.json
            Data/quarterly_data.csv
          if-no-files-found: ignore
          retention-days: 14

      # Option A) Auto-commit changes in data/ or models/ (if you want the app to pick them up on push)
      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly EoM update: data/models [skip ci]"
            git push
          fi
